<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - CineMatch</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">

    <style>
        body {
            background-color: #0b0d14;
            color: white;
            font-family: Arial, sans-serif;
        }

        .auth-container {
            width: calc(100% - 30px);
            max-width: 420px;
            margin: 50px auto;
            padding: 32px;
            box-sizing: border-box;
            background-color: #202437;
            border: 1px solid #30354a;
            border-radius: 15px;
        }

        .auth-container h2 {
            color: #ffbd2e;
            text-align: center;
            margin: 10px 0 15px;
            line-height: 1.4;
        }

        .auth-subtitle {
            text-align: center;
            color: #9aa1b3;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .auth-container label {
            display: block;
            margin: 18px 0 8px;
            font-size: 15px;
        }

        .auth-container input {
            display: block;
            width: 100%;
            height: 46px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d5d7df;
            border-radius: 7px;
            background-color: white;
            color: #171923;
            font-size: 15px;
        }

        .auth-container input::placeholder {
            color: #9aa1b3;
        }

        .password-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .auth-container .password-container input {
            flex: 1 1 auto;
            width: 0;
            min-width: 0;
            height: 46px;
        }

        .toggle-password {
            flex: 0 0 70px;
            width: 70px;
            height: 46px;
            padding: 0 8px;
            border: none;
            border-radius: 7px;
            background-color: #ffbd2e;
            color: #171923;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .toggle-password:hover,
        .auth-submit:hover {
            background-color: #f0a900;
        }

        .auth-submit {
            display: block;
            width: 100%;
            min-height: 46px;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background-color: #ffbd2e;
            color: #171923;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .auth-switch {
            margin-top: 22px;
            text-align: center;
            line-height: 1.6;
            font-size: 15px;
        }

        .auth-switch a {
            color: #ffbd2e;
            font-weight: bold;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="auth-container">
    <h2>Reset Password 🔒</h2>
    <p class="auth-subtitle">
        Enter and confirm your new password below (minimum 8 characters).
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash-message {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST"
          action="{{ url_for('reset_password', token=token) }}">

        <label for="new_password">New Password</label>
        <div class="password-container">
            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password (min. 8 characters)"
                autocomplete="new-password"
                minlength="8"
                required
            >
            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('new_password', this)"
                aria-controls="new_password"
                aria-pressed="false"
            >Show</button>
        </div>

        <label for="confirm_password">Confirm New Password</label>
        <div class="password-container">
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Re-enter new password"
                autocomplete="new-password"
                minlength="8"
                required
            >
            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('confirm_password', this)"
                aria-controls="confirm_password"
                aria-pressed="false"
            >Show</button>
        </div>

        <button type="submit" class="auth-submit">
            Update Password
        </button>
    </form>

    <div class="auth-switch">
        <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const password = document.getElementById(inputId);

        if (password.type === "password") {
            password.type = "text";
            button.textContent = "Hide";
            button.setAttribute("aria-pressed", "true");
        } else {
            password.type = "password";
            button.textContent = "Show";
            button.setAttribute("aria-pressed", "false");
        }
    }
</script>

    </div>

    <script>
        function togglePassword(inputId, button) {
            const password = document.getElementById(inputId);

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";

            } else {
                password.type = "password";
                button.textContent = "Show";
                button.setAttribute("aria-pressed", "false");
            }
        }
    </script>

</body>
</html>
