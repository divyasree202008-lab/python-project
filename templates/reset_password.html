<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - CineMatch</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #101827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #202b3d;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            text-align: center;
        }

        h2 {
            color: #f5b82e;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #555;
            border-radius: 6px;
            background-color: #101827;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #f5b82e;
            color: black;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #e0a51f;
        }

        .message {
            color: #f5b82e;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Reset Your Password</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('reset_password', token=token) }}">

            <input
                type="password"
                name="new_password"
                placeholder="Enter new password"
                minlength="8"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="8"
                required
            >

            <button type="submit">Update Password</button>

        </form>

    </div>

</body>
</html>
