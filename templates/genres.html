
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Favorite Genres - CineMatch</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101522;
            color: white;
        }

        header {
            background: #080d18;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #f5b82e;
            margin: 0;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px;
            background: #202b40;
            border-radius: 12px;
        }

        h2 {
            color: #f5b82e;
            text-align: center;
        }

        p {
            text-align: center;
            color: #c2c9d5;
        }

        .genre-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .genre-option {
            background: #101522;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .genre-option:hover {
            background: #35445e;
        }

        input[type="checkbox"] {
            accent-color: #f5b82e;
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #f5b82e;
            color: #171717;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ffd36a;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #f5b82e;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .container {
                margin: 20px;
                padding: 20px;
            }

            .genre-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎬 CineMatch</h1>
</header>

<div class="container">

    <h2>❤️ Choose Your Favorite Genres</h2>

    <p>
        Select the genres you enjoy watching.
        We will recommend movies based on your choices.
    </p>

    <form action="{{ url_for('save_genres') }}" method="POST">

        <div class="genre-list">

            {% for genre in genres %}

                <label class="genre-option">
                    <input
                        type="checkbox"
                        name="genres"
                        value="{{ genre }}"
                    >
                    {{ genre }}
                </label>

            {% endfor %}

        </div>

        <button type="submit">
            Save My Favorite Genres
        </button>

    </form>

    <a href="{{ url_for('index') }}" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
